name: Rincón del Militar ➡️ Prensa
id: prensa
box:
  align: left
boxes:
- get:
  - from: prensa.sub
    to: sub
  - from: prensa.title
    to: title
  hs: .03
  hs_vs: .05
- mt: 2
  class: prensa
  get:
  - from: prensa.boxes
    to: boxes
  box:
    cols: 2
    pd_vs: 1.5
    color: such
    align_x: left
    label: '{{ get prensa.label }}'
    ir: north_east
    btn: none
    btn_full: false
    sort:
    - sub

