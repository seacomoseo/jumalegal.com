name: Nosotros ➡️ Colaboradores
id: colaboradores
box:
  align: left
boxes:
- get:
  - from: colaboradores.sub
    to: sub
- boxes:
  - get:
    - from: colaboradores.title
      to: title
    hs: 1
  - get:
    - from: colaboradores.md
      to: md
  box:
    cols: 2
    gap_vs: 1
    align_y: bottom
    align_x: space-between
- mt: 2
  get:
  - from: colaboradores.boxes
    to: boxes
  box:
    cols: 6
    cols_vs: 2
    gap: 2
    gap_vs: 1.5
    align: left
    ratio: 3/1
    contain: true
    gray: true
    hs: 4
    md_sm: true
- id: militares-con-futuro
  mt: 5
  fit: .75
  boxes:
  - get:
    - from: colaboradores.mcf.img
      to: img
    - from: colaboradores.mcf.alt
      to: alt
    fit: .3
    fit_vs: .5
    gray: true
  - get:
    - from: colaboradores.mcf.sub
      to: sub
    - from: colaboradores.mcf.title
      to: title
    - from: colaboradores.mcf.md
      to: md
    fit: .6
  box:
    gap: 3
    gap_vs: 2
    align_y: center
    align_x: left
    align: left


