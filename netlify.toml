[build]
publish = "public"
command = "sh do hugo"

[build.environment]
HUGO_VERSION = "0.168.0"
NODE_VERSION = "22.22.3"
PNPM_FLAGS = "--frozen-lockfile --config.enable-global-virtual-store=false"

[context.production]
publish = "public"
command = "sh do hugo"

[[plugins]]
  package = "netlify-plugin-hugo-cache-resources"
