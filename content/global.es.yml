colaboradores:
  sub: 02 **Profesionales colaboradores**
  title: Especialidades que suman. **Manuel al frente de tu asunto.**
  md: |
    Una red de profesionales y despachos independientes que complementa el trabajo de Juma
    según las necesidades de cada caso, con Manuel como referencia para tu consulta.
  boxes:
  - hanchor: ABYTE
    img: /u/colaboradores/abyte.png
    alt: ABYTE
    md: Derecho Administrativo
    # md: Colaboración en Derecho Administrativo y Urbanismo.
  - hanchor: Apestegui Abogados
    img: /u/colaboradores/apestegui.png
    alt: Apestegui Abogados
    md: Despacho colaborador
    # md: Colaboración en asuntos de Derecho Militar y Guardia Civil.
  - hanchor: Ángeles Martínez Cudero
    img: /u/colaboradores/martinez-cudero.png
    alt: Ángeles Martínez Cudero
    md: Abogada colaboradora
    # md: Colaboración en asuntos de Derecho Militar y Guardia Civil. Ejerce como profesional autónoma vinculada a Apestegui.
  - hanchor: EVALUO
    img: /u/colaboradores/evaluo.png
    alt: EVALUO
    md: Valoración de daño corporal
    # md: Dr. José Antonio López Morata. Peritaje médico-legal y apoyo en expedientes de insuficiencia de condiciones psicofísicas (EICP).
  - hanchor: IPFLegal
    img: /u/colaboradores/ipflegal.png
    alt: IPFLegal
    md: Psicología Forense
    # md: Instituto de Psicología Forense
    # md: Colaboración en psicología forense y apoyo especializado.
  - hanchor: Fiscalisy
    img: /u/colaboradores/fiscalisy.png
    alt: Fiscalisy
    md: Asesoramiento Fiscal
    # md: Asesoría fiscal colaboradora de Juma Legal.
  # - hanchor: Militares Con Futuro (MCF)
  #   img: /u/colaboradores/mcf.png
  #   md: Asociación Profesional
  mcf:
    img: /u/colaboradores/mcf.png
    alt: Asociación Profesional Militares Con Futuro
    sub: Otras relaciones profesionales
    title: Militares Con Futuro
    md: |
      Manuel Acosta presta asesoramiento jurídico a una de las principales asociaciones de militares del panorama nacional:
      Militares Con Futuro. Juma Legal también atiende asuntos particulares de militares y miembros de la Guardia Civil.

